<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اليوم الوطني السعودي 96</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:#021e20; color:#fff; font-family:"IBM Plex Sans Arabic", sans-serif; }
    button, input { font:inherit; }
    .screen { position:relative; width:100%; height:100dvh; overflow:hidden; background:radial-gradient(ellipse 52% 42% at 51% 8%, rgba(44,112,96,.72) 0%, rgba(20,81,73,.34) 40%, transparent 74%),radial-gradient(ellipse 45% 60% at 6% 90%, rgba(15,85,76,.52) 0%, transparent 76%),linear-gradient(123deg, #032728 0%, #052b2d 42%, #011d1f 80%, #00191b 100%); }
    .geometry, .geometry::before, .geometry::after { position:absolute; content:""; pointer-events:none; }
    .geometry { inset:0; overflow:hidden; }
    .geometry::before { width:78vw; height:78vw; min-width:790px; min-height:790px; right:-28vw; top:-31vw; transform:rotate(45deg); border:1px solid rgba(50,144,124,.34); background:linear-gradient(135deg, rgba(16,85,77,.27), rgba(0,21,24,.06) 63%); box-shadow:inset 45px -45px 90px rgba(0,0,0,.13); }
    .geometry::after { width:67vw; height:67vw; min-width:685px; min-height:685px; left:-39vw; top:43vh; transform:rotate(45deg); border:1px solid rgba(47,167,142,.38); border-radius:0 0 11% 0; background:linear-gradient(135deg, rgba(12,76,69,.45), rgba(0,30,32,.02) 62%); }
    .central-facet { position:absolute; width:72vw; height:72vw; min-width:865px; min-height:865px; top:-48vw; left:37vw; transform:rotate(45deg); background:linear-gradient(135deg, rgba(0,20,23,.08), rgba(3,46,48,.42) 75%); border:1px solid rgba(54,138,122,.1); pointer-events:none; }
    .right-arrow { position:absolute; right:-1.1vw; top:16.1vh; width:24.5vw; height:43vh; min-width:300px; clip-path:polygon(100% 0, 100% 100%, 0 50%); background:linear-gradient(115deg, rgba(147,237,91,.94), rgba(56,144,87,.58) 37%, rgba(2,46,43,.2) 91%); filter:drop-shadow(-1px 0 5px #9bea62); pointer-events:none; }
    .right-arrow::after { position:absolute; content:""; left:0; top:0; width:100%; height:100%; clip-path:polygon(0 49.4%, 100% 0, 99.2% 3%, .9% 50.1%); background:#a5f266; opacity:.95; }
    .diagonal-edge { position:absolute; right:-3vw; bottom:8vh; width:36vw; height:1px; transform:rotate(-45deg); background:linear-gradient(90deg,transparent,#94ed5d 22%,rgba(143,232,92,.12)); box-shadow:0 0 5px #83db4f; pointer-events:none; }
    .edge-left { position:absolute; left:-3vw; top:52vh; width:31vw; height:1px; transform:rotate(45deg); background:linear-gradient(90deg,transparent,#68bf9d 70%,transparent); pointer-events:none; }
    .brand { position:absolute; z-index:3; display:block; object-fit:contain; }
    .brand-sami { top:4.1vh; left:3.5vw; width:15.4vw; max-width:238px; min-width:154px; filter:brightness(0) invert(1); }
    .brand-watan { top:3.5vh; right:3.6vw; width:12.2vw; max-width:187px; min-width:145px; }

    .mic-zone { position:absolute; z-index:2; top:14.7vh; left:50%; width:min(59vw, 910px); height:25.5vh; min-height:230px; transform:translateX(-50%); }
    .halo { position:absolute; left:50%; top:50%; border-radius:50%; transform:translate(-50%,-50%); }
    .halo-dots { width:23.2vw; height:23.2vw; max-width:357px; max-height:357px; border:1px dashed rgba(109,218,136,.21); opacity:.76; }
    .halo-outer { width:15.2vw; height:15.2vw; max-width:234px; max-height:234px; border:1px solid rgba(90,215,123,.25); box-shadow:0 0 35px rgba(75,191,106,.11); }
    .halo-inner { width:12.8vw; height:12.8vw; max-width:197px; max-height:197px; padding:7px; background:conic-gradient(from 0deg,#6abb9e,#6fbd4d 15%,#a0eb5e 25%,#74cb58 40%,#25856c 63%,#6ac59b 78%,#8ce55b); box-shadow:0 0 22px rgba(114,190,68,.38); }
    .halo-inner::before { content:""; position:absolute; inset:7px; border-radius:inherit; background:radial-gradient(circle at 50% 40%, rgba(9,58,56,.74), #062f31 70%); border:1px solid rgba(255,255,255,.05); }
    .microphone { position:absolute; z-index:1; top:50%; left:50%; width:78px; height:78px; transform:translate(-50%,-50%); filter:drop-shadow(0 0 8px rgba(255,255,255,.12)); }
    .wave { position:absolute; top:50%; left:0; width:100%; height:105px; display:flex; align-items:center; justify-content:space-between; transform:translateY(-50%); }
    .wave i { display:block; flex:0 0 2px; height:var(--h); border-radius:5px; background:linear-gradient(to bottom,#4eb778,#a7ec60,#f7fff2); box-shadow:0 0 7px rgba(104,221,105,.48); opacity:var(--o, .84); transform-origin:center; }
    .wave i:nth-child(3n) { background:linear-gradient(#205e5b,#69cd59); opacity:.74; }.playing .wave i { animation:pulse .85s ease-in-out infinite alternate; animation-delay:var(--delay); }@keyframes pulse { to { transform:scaleY(.46); opacity:.45; } }

    .player { position:absolute; z-index:4; top:49.7vh; left:50%; display:grid; grid-template-columns:66px 356px 43px 92px 46px; align-items:center; column-gap:18px; width:674px; height:66px; transform:translateX(-50%); direction:ltr; isolation:isolate; }
    .control { display:grid; place-items:center; min-width:44px; min-height:44px; border:0; color:#fff; background:transparent; cursor:pointer; transition:color .2s ease, transform .2s ease, background .2s ease; }.control:hover { color:#9ee868; transform:scale(1.06); }.control:focus-visible, .range:focus-visible { outline:2px solid #9ee868; outline-offset:3px; }
    .play { width:66px; height:66px; border:2px solid #82db58; border-radius:50%; background:rgba(4,43,43,.39); box-shadow:0 0 18px rgba(103,205,79,.12), inset 0 0 12px rgba(111,190,77,.07); }.play svg { width:23px; height:23px; margin-left:4px; }
    .time-line { position:relative; align-self:stretch; height:100%; }.time-line .range { position:absolute; top:calc(50% - 9px); left:0; }.range { width:100%; height:18px; appearance:none; cursor:pointer; background:transparent; --value:0%; }.range::-webkit-slider-runnable-track { height:6px; border-radius:99px; background:linear-gradient(90deg,#8de65b 0 var(--value),rgba(147,190,190,.38) var(--value) 100%); }.range::-webkit-slider-thumb { appearance:none; width:14px; height:14px; margin-top:-4px; border-radius:50%; background:#92e863; box-shadow:0 0 7px rgba(137,231,94,.78); }.range::-moz-range-track { height:6px; border-radius:99px; background:rgba(147,190,190,.38); }.range::-moz-range-progress { height:6px; border-radius:99px; background:#8de65b; }.range::-moz-range-thumb { width:14px; height:14px; border:0; border-radius:50%; background:#92e863; }
    .times { position:absolute; top:calc(50% + 15px); left:0; width:100%; display:flex; justify-content:space-between; color:#c7d1d1; font-family:Arial,sans-serif; font-size:15px; line-height:1; direction:ltr; }.volume { width:43px; height:44px; }.volume svg, .fullscreen svg { width:25px; height:25px; }.volume-range { width:92px; --value:62%; }.fullscreen { width:46px; height:44px; }
    .audio-label { position:absolute; z-index:3; top:59.75vh; left:50%; height:60px; min-width:395px; display:flex; align-items:center; justify-content:center; gap:23px; padding:0 28px; transform:translateX(-50%); border:1px solid rgba(73,167,144,.33); border-radius:22px; background:rgba(1,40,41,.42); color:#d0dddd; font-size:15px; direction:ltr; }.audio-label .divider { width:1px; height:27px; background:rgba(187,222,218,.26); }.audio-label time { font-family:Arial,sans-serif; font-size:15px; }.audio-label svg { width:25px; height:25px; }.audio-label .green { color:#93e759; }
    .national { position:absolute; z-index:3; top:73.2vh; left:50%; transform:translateX(-50%); width:640px; text-align:center; }.national-line { display:flex; align-items:center; justify-content:center; gap:34px; direction:ltr; }.number { margin:0; color:#80d95a; font-family:Arial,sans-serif; font-size:78px; font-weight:300; letter-spacing:-.1em; line-height:.8; }.split { width:1px; height:58px; background:#78ba95; }.national h2 { margin:0; color:#fff; font-size:29px; font-weight:400; letter-spacing:-.04em; direction:rtl; }.dates { display:flex; align-items:center; justify-content:center; gap:28px; margin-top:32px; color:#fff; font-size:16px; direction:rtl; white-space:nowrap; }.date { display:flex; align-items:center; gap:11px; }.calendar { width:25px; height:25px; color:#80d955; }.dates .split { height:27px; background:rgba(255,255,255,.45); }
    .corner-line { position:absolute; bottom:10.1vh; width:101px; height:1px; background:rgba(204,220,217,.45); }.corner-line.left { left:4.8vw; }.corner-line.right { right:4.8vw; }
    @media (max-width:700px) { .brand-sami { width:35vw; min-width:0; top:3.6vh; left:4vw; }.brand-watan { width:29vw; min-width:0; top:3.7vh; right:4vw; }.mic-zone { top:20vh; width:84vw; height:27vh; min-height:0; }.halo-dots { width:56vw; height:56vw; }.halo-outer { width:38vw; height:38vw; }.halo-inner { width:32vw; height:32vw; padding:5px; }.halo-inner::before { inset:5px; }.microphone { width:50px; height:50px; }.wave { height:74px; }.wave i { flex-basis:1.5px; }.player { top:52vh; width:82vw; height:108px; grid-template-columns:52px 44px 96px 44px minmax(0, 1fr); grid-template-rows:56px 44px; gap:10px 8px; }.player::before { content:""; position:absolute; z-index:-1; inset:-24px -12px; background:radial-gradient(ellipse at center, rgba(0,25,27,.68) 0%, rgba(0,25,27,.4) 48%, transparent 78%); filter:blur(5px); pointer-events:none; }.play { grid-row:1; grid-column:1; justify-self:start; width:52px; height:52px; }.play svg { width:19px; height:19px; }.time-line { grid-row:1; grid-column:2 / -1; width:100%; height:56px; }.volume { grid-row:2; grid-column:2; justify-self:center; width:44px; height:44px; min-width:44px; }.volume-range { grid-row:2; grid-column:3; width:96px; margin:0; }.fullscreen { grid-row:2; grid-column:4; justify-self:center; width:44px; height:44px; min-width:44px; }.volume svg, .fullscreen svg { width:20px; height:20px; }.times { font-size:11px; top:calc(50% + 13px); }.national { top:80.5vh; width:100%; }.national-line { gap:20px; }.number { font-size:15vw; }.split { height:42px; }.national h2 { font-size:5.4vw; }.dates { gap:13px; margin-top:18px; font-size:3.2vw; }.calendar { width:19px; height:19px; }.dates .split { height:20px; }.right-arrow { opacity:.58; }.corner-line { display:none; } }
    @media (max-height:650px) and (max-width:700px) { .mic-zone { top:15.5vh; }.player { top:47vh; }.national { top:76.5vh; }.dates { margin-top:11px; } }
    @media (min-width:701px) and (max-height:720px) { .mic-zone { top:12.5vh; height:27vh; }.player { top:47.5vh; }.audio-label { top:57.7vh; }.national { top:70vh; }.national .dates { margin-top:21px; }.number { font-size:64px; }.national h2 { font-size:25px; } }
    @media (max-width:380px) { .player { width:88vw; grid-template-columns:48px 44px 54px 44px minmax(0, 1fr); gap:5px; }.play { width:48px; height:48px; }.volume-range { width:54px; }.volume, .fullscreen { min-width:44px; width:44px; }.volume svg, .fullscreen svg { width:18px; height:18px; }.dates { font-size:3vw; gap:9px; }.date { gap:6px; }.national h2 { font-size:5vw; } }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <main class="screen" aria-label="اليوم الوطني السعودي">
    <div class="geometry" aria-hidden="true"></div><div class="central-facet" aria-hidden="true"></div><div class="right-arrow" aria-hidden="true"></div><div class="diagonal-edge" aria-hidden="true"></div><div class="edge-left" aria-hidden="true"></div>
    <img class="brand brand-sami" src="assets/logos/sami-logo.png" alt="SAMI"><img class="brand brand-watan" src="assets/logos/watan-yared-al-sawt.png.png" alt="وطن يرد الصوت">
    <section class="mic-zone" id="audioVisual" aria-hidden="true"><div class="wave" id="waveform"></div><div class="halo halo-dots"></div><div class="halo halo-outer"></div><div class="halo halo-inner"></div><svg class="microphone" viewBox="0 0 64 64" fill="none"><rect x="22" y="7" width="20" height="34" rx="10" stroke="white" stroke-width="3.5"/><path d="M15 31.5C15 41.1 22.6 48 32 48s17-6.9 17-16.5M32 48v9M25 57h14" stroke="white" stroke-width="3.5" stroke-linecap="round"/></svg></section>
    <section class="player" dir="ltr" aria-label="مشغل المقطع الصوتي"><button id="playButton" class="control play" type="button" aria-label="تشغيل المقطع الصوتي"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15L19 12 7 4.5Z"/></svg></button><div class="time-line"><input id="progress" class="range" type="range" min="0" max="100" value="0" step="0.01" aria-label="تقدم المقطع الصوتي"><div class="times"><time id="currentTime">00:00</time><time id="duration">00:45</time></div></div><button id="muteButton" class="control volume" type="button" aria-label="كتم الصوت"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" stroke-linecap="round" stroke-linejoin="round"/></svg></button><input id="volume" class="range volume-range" type="range" min="0" max="1" value=".62" step=".01" aria-label="مستوى الصوت"><button id="fullscreenButton" class="control fullscreen" type="button" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" stroke-linecap="round"/></svg></button></section>
    <section class="national" aria-label="معلومات اليوم الوطني"><div class="national-line"><p class="number">96</p><span class="split"></span><h2>اليوم الوطني السعودي</h2></div><div class="dates"><span class="date"><svg class="calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="1"/><path d="M7.5 3v4M16.5 3v4M3.5 9h17M8 13h.01M12 13h.01M16 13h.01M8 16h.01M12 16h.01M16 16h.01" stroke-linecap="round"/></svg>23 سبتمبر 2026م</span><span class="split"></span><span class="date"><svg class="calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="1"/><path d="M7.5 3v4M16.5 3v4M3.5 9h17M8 13h.01M12 13h.01M16 13h.01M8 16h.01M12 16h.01M16 16h.01" stroke-linecap="round"/></svg>12 ربيع الآخر 1448هـ</span></div></section>
    <span class="corner-line left" aria-hidden="true"></span><span class="corner-line right" aria-hidden="true"></span><audio id="audio" preload="metadata" src="assets/audio/national-day.mp3"></audio>
  </main>
  <script>
    const audio = document.getElementById('audio'), visual = document.getElementById('audioVisual'), waveform = document.getElementById('waveform');
    const play = document.getElementById('playButton'), playIcon = document.getElementById('playIcon'), progress = document.getElementById('progress'), volume = document.getElementById('volume'), mute = document.getElementById('muteButton'), fullscreen = document.getElementById('fullscreenButton');
    const current = document.getElementById('currentTime'), duration = document.getElementById('duration');
    const bars = [3,4,6,8,11,16,27,43,56,30,18,39,64,48,24,14,19,37,61,72,35,21,9,6,4,6,9,15,28,47,64,38,21,12,7,4,6,9,15,28,44,67,52,27,13,8,5,4,3,3];
    bars.forEach((height, index) => { const bar = document.createElement('i'); bar.style.setProperty('--h', height + 'px'); bar.style.setProperty('--delay', (index % 8) * .08 + 's'); bar.style.setProperty('--o', Math.max(.32, height / 72).toFixed(2)); waveform.appendChild(bar); });
    const formatTime = seconds => { if (!Number.isFinite(seconds)) return '00:45'; const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; };
    const paintRange = input => input.style.setProperty('--value', `${((input.value - input.min) / (input.max - input.min)) * 100}%`);
    const syncPlayback = () => { const active = !audio.paused && !audio.ended; visual.classList.toggle('playing', active); play.setAttribute('aria-label', active ? 'إيقاف مؤقت' : 'تشغيل المقطع الصوتي'); playIcon.innerHTML = active ? '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>' : '<path d="M7 4.5v15L19 12 7 4.5Z"/>'; };
    play.addEventListener('click', () => { if (audio.ended) audio.currentTime = 0; audio.paused ? audio.play() : audio.pause(); });
    audio.addEventListener('play', syncPlayback); audio.addEventListener('pause', syncPlayback); audio.addEventListener('ended', syncPlayback);
    audio.addEventListener('loadedmetadata', () => { duration.textContent = formatTime(audio.duration); });
    audio.addEventListener('timeupdate', () => { const value = audio.duration ? audio.currentTime / audio.duration : 0; progress.value = value * 100; paintRange(progress); current.textContent = formatTime(audio.currentTime); });
    progress.addEventListener('input', () => { if (audio.duration) audio.currentTime = audio.duration * progress.value / 100; paintRange(progress); });
    volume.addEventListener('input', () => { audio.volume = volume.value; audio.muted = false; paintRange(volume); });
    mute.addEventListener('click', () => { audio.muted = !audio.muted; mute.setAttribute('aria-label', audio.muted ? 'إلغاء كتم الصوت' : 'كتم الصوت'); });
    fullscreen.addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); });
    audio.volume = volume.value; paintRange(progress); paintRange(volume);
  </script>
</body>
</html>
